name: tests

# Por que existe: habia 11 suites y ningun runner ni CI, asi que solo corrian cuando alguien se
# acordaba de lanzarlas a mano. Ademas todas se habian ejecutado SOLO en macOS, y varias usan
# construcciones que difieren entre BSD y GNU (`sed -i`, `stat`, `date -r`, `script` para el pty).
# Este workflow es la primera vez que se ejecutan en Linux.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suites:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # que una plataforma no oculte el resultado de las otras
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: version de las herramientas
        shell: bash
        run: |
          bash --version | head -1
          python3 --version
          git --version
      - name: suites
        shell: bash
        run: bash tools/run-tests.sh

  # Windows va aparte y NO bloquea: `resolve-project-dir.sh` nunca se ha probado en Git Bash y hay
  # un pendiente abierto que lo dice. Esto lo convierte en una medicion en vez de una suposicion.
  # Si se pone verde de forma estable, sube a la matriz de arriba y se cierra ese pendiente.
  windows:
    name: windows-latest (informativo)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: que entorno es esto (diagnostico, no es una prueba)
        shell: bash
        run: |
          echo "uname          : $(uname -s)"
          echo "bash           : $BASH_VERSION"
          echo "which python3  : $(command -v python3)"
          echo "sys.executable : $(python3 -c 'import sys;print(sys.executable)')"
          echo "os.name        : $(python3 -c 'import os;print(os.name)')"
          echo "cygpath        : $(command -v cygpath || echo NO)"
          echo "pwd (bash)     : $PWD"
          echo "cygpath -w pwd : $(cygpath -w "$PWD" 2>/dev/null || echo n/a)"
          echo "TMPDIR         : ${TMPDIR:-<vacio>}"
          T=$(mktemp -d); echo "mktemp -d      : $T"
          echo "cygpath -w tmp : $(cygpath -w "$T" 2>/dev/null || echo n/a)"
          echo "--- puede python abrir un fichero creado por bash en ese temporal? ---"
          echo hola > "$T/f.txt"
          python3 -c "import sys;print('  ruta MSYS  :', open(sys.argv[1]).read().strip())" "$T/f.txt" 2>&1 | head -2
          W=$(cygpath -w "$T/f.txt" 2>/dev/null) && python3 -c "import sys;print('  ruta Windows:', open(sys.argv[1]).read().strip())" "$W" 2>&1 | head -2
      - name: suites en Git Bash
        shell: bash
        run: bash tools/run-tests.sh
