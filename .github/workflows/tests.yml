name: tests

# Por que existe: habia 11 suites y ningun runner ni CI, asi que solo corrian cuando alguien se
# acordaba de lanzarlas a mano, una por una. Ademas todas se habian ejecutado SOLO en macOS.
#
# La primera corrida en Linux y Windows encontro NUEVE defectos, cinco de ellos en codigo que se
# distribuye: el texto en espanol salia con los acentos rotos en Windows, el aviso de escritura a
# mano no disparaba nunca en Linux, el detector de hooks heredados no disparaba nunca en Windows.
# Ninguno lo habia visto ninguna suite en meses, y la del resolutor llevaba encima dos rondas de
# adversario. No era un hueco de rigor sino de plataforma, y eso solo lo cierra ejecutar en la otra.
#
# 2026-10-14: este workflow corre SOLO ubuntu; macOS y Windows estan en platforms.yml y corren al
# publicar version (cambio de plugin.json o marketplace.json en main) o a mano. Medido ese dia: cada
# corrida de 3 sistemas tardaba 2-3,5 h de reloj (Windows 137 min, macOS 85, ubuntu 45) y el 90 % era
# tools/mutation-check.sh en serie. Aqui corre en 4 tandas paralelas (MUT_JOBS).
on:
  push:
    branches: [main]
    # Un checkpoint de memoria no toca codigo: no hay nada que probar.
    paths-ignore: ['memory/**']
  pull_request:
    paths-ignore: ['memory/**']
  workflow_dispatch:

# Un push nuevo a la misma rama de un PR cancela la corrida vieja: ya no prueba el ultimo commit.
# En main no se cancela: cada merge queda probado.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suites:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tools/recall-bench/compare-motores.py lee el motor viejo de recall en 3119885 (F0).
          fetch-depth: 0
      - name: version de las herramientas
        shell: bash
        run: |
          uname -s
          nproc
          bash --version | head -1
          python3 --version
          git --version
      # Solo para las pruebas: el oraculo de rewrite_rule (tools/oraculo-rewrite-rule.py) necesita un
      # parser CommonMark de referencia. El plugin NO lo usa ni lo distribuye. Sin este paso el
      # oraculo sale como skip. El import final hace que falle aqui, a la vista, si la instalacion no
      # llego (PEP 668 puede rechazar --user sin el flag).
      - name: oraculo (markdown-it-py)
        shell: bash
        run: |
          python3 -m pip install --user markdown-it-py \
            || python3 -m pip install --user --break-system-packages markdown-it-py
          python3 -c "import markdown_it; print('markdown-it-py', markdown_it.__version__)"
      - name: suites
        shell: bash
        env:
          MUT_JOBS: '4'
        run: bash tools/run-tests.sh
