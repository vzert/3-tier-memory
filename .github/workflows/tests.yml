name: tests

# Por que existe: habia 11 suites y ningun runner ni CI, asi que solo corrian cuando alguien se
# acordaba de lanzarlas a mano. Ademas todas se habian ejecutado SOLO en macOS, y varias usan
# construcciones que difieren entre BSD y GNU (`sed -i`, `stat`, `date -r`, `script` para el pty).
# Este workflow es la primera vez que se ejecutan en Linux.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suites:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # que una plataforma no oculte el resultado de las otras
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: version de las herramientas
        shell: bash
        run: |
          bash --version | head -1
          python3 --version
          git --version
      - name: suites
        shell: bash
        run: bash tools/run-tests.sh

  # Windows va aparte y NO bloquea: `resolve-project-dir.sh` nunca se ha probado en Git Bash y hay
  # un pendiente abierto que lo dice. Esto lo convierte en una medicion en vez de una suposicion.
  # Si se pone verde de forma estable, sube a la matriz de arriba y se cierra ese pendiente.
  windows:
    name: windows-latest (informativo)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: diagnostico del caso d6 (temporal)
        shell: bash
        run: |
          set -u
          B=plugins/3-tier-memory/bin
          T=$(mktemp -d); D6="$T/d6"
          mkdir -p "$D6/.claude/hooks" "$D6/memory"
          printf '#!/bin/bash\nP=$(grep -E "^- \\[ \\]" "$CLAUDE_PROJECT_DIR/memory/_pendientes.md")\necho "$P"\n' > "$D6/.claude/hooks/session-start.sh"
          printf '# P\n\n## Alta prioridad\n- [ ] x\n' > "$D6/memory/_pendientes.md"
          python3 -c "
import json,sys
cmd='/usr/bin/env bash \$CLAUDE_PROJECT_DIR/.claude/hooks/session-start.sh'
json.dump({'hooks':{'SessionStart':[{'hooks':[{'type':'command','command':cmd}]}]}}, open(sys.argv[1],'w'))
" "$D6/.claude/settings.local.json"
          python3 - "$B/session-start.sh" "$T/dup.py" <<'PYX'
import sys
l=open(sys.argv[1],encoding="utf-8").read().split("\n")
a=next(i for i,x in enumerate(l) if "<<'DUPEOF'" in x)
b=next(i for i,x in enumerate(l) if x.strip()=="DUPEOF" and i>a)
open(sys.argv[2],"w",encoding="utf-8").write("\n".join(l[a+1:b]))
PYX
          echo "--- lo que ve python del entorno ---"
          CLAUDE_PROJECT_DIR="$D6" MEMORY_DIR="$D6/memory" python3 -c "
import os, shlex, json
proj = os.environ.get('CLAUDE_PROJECT_DIR','')
print('  proj            =', repr(proj))
print('  proj isdir      =', os.path.isdir(proj))
hook = proj + '/.claude/hooks/session-start.sh'
print('  hook isfile     =', os.path.isfile(hook))
cmd = json.load(open(os.path.join(proj,'.claude','settings.local.json')))['hooks']['SessionStart'][0]['hooks'][0]['command']
print('  cmd             =', repr(cmd))
exp = cmd.replace('\$CLAUDE_PROJECT_DIR', proj.replace(chr(92),'/'))
print('  expanded        =', repr(exp))
print('  shlex tokens    =', shlex.split(exp, posix=True))
"
          echo "--- salida real del detector ---"
          CLAUDE_PROJECT_DIR="$D6" MEMORY_DIR="$D6/memory" python3 "$T/dup.py"; echo "  rc=$?"
      - name: suites en Git Bash
        shell: bash
        run: bash tools/run-tests.sh
